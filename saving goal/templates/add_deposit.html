<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Deposit Tracker - Add Deposit</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "surface-container-high": "#dee8ff",
            "surface-variant": "#d8e3fb",
            "on-surface": "#111c2d",
            "surface-container-lowest": "#ffffff",
            "primary-container": "#10b981",
            "primary": "#006c49",
            "surface-container": "#e7eeff",
            "surface-container-low": "#f0f3ff",
            "surface": "#f9f9ff",
            "outline": "#6c7a71"
          },
          "fontFamily": {
            "headline-xl": ["Inter"],
            "body-md": ["Inter"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between">
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-50 w-full bg-surface-container-lowest/90 backdrop-blur-md border-b border-surface-container shadow-sm">
    <div class="h-16 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-primary-container/20 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-[22px]">savings</span>
        </div>
        <span class="text-xl font-bold text-on-surface tracking-tight">Deposit Tracker</span>
      </div>
      <a class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-medium text-sm transition-all" href="{{ url_for('home') }}">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        <span>Back to Home</span>
      </a>
    </div>
  </header>

  <main class="w-full flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-surface-container-lowest p-8 rounded-2xl shadow-sm border border-surface-container space-y-6">
      <div class="space-y-1">
        <div class="w-10 h-10 rounded-xl bg-primary-container/20 flex items-center justify-center text-primary mb-2">
          <span class="material-symbols-outlined text-[22px]">add_circle</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface tracking-tight">Add New Deposit</h1>
        <p class="text-xs text-outline">Record a new contribution towards your savings goal.</p>
      </div>

      <form action="{{ url_for('add_deposit') }}" method="post" class="space-y-4">
        <div>
          <label for="date" class="block text-xs font-semibold uppercase tracking-wider text-on-surface mb-1">Date</label>
          <input type="date" id="date" name="date" required class="w-full px-3.5 py-2.5 bg-surface-container-low border border-surface-container rounded-xl text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container" />
        </div>

        <div>
          <label for="deposit_money" class="block text-xs font-semibold uppercase tracking-wider text-on-surface mb-1">Deposit Amount ($)</label>
          <input type="number" id="deposit_money" name="deposit_money" step="any" placeholder="e.g. 1500" required class="w-full px-3.5 py-2.5 bg-surface-container-low border border-surface-container rounded-xl text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container" />
        </div>

        <div>
          <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-on-surface mb-1">Description (Optional)</label>
          <input type="text" id="description" name="description" placeholder="e.g. Monthly salary, bonus" class="w-full px-3.5 py-2.5 bg-surface-container-low border border-surface-container rounded-xl text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container" />
        </div>

        <div class="pt-2 flex items-center gap-3">
          <button type="submit" class="flex-1 py-3 px-4 bg-primary-container hover:bg-primary text-on-primary font-semibold text-sm rounded-xl transition-colors shadow-sm flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-[18px]">check</span>
            <span>Add Deposit</span>
          </button>
          <a href="{{ url_for('home') }}" class="py-3 px-4 bg-surface-container-low hover:bg-surface-container text-on-surface font-medium text-sm rounded-xl transition-colors text-center">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </main>

  <footer class="w-full bg-surface-container-lowest border-t border-surface-container py-4 text-center text-xs text-outline">
    © 2025 Deposit Tracker. Personal Liquidity Management.
  </footer>

  <script>
    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();
  </script>
</body>
</html>
