<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Deposit Tracker - Congratulations!</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "surface-container-high": "#dee8ff",
            "surface-variant": "#d8e3fb",
            "on-surface": "#111c2d",
            "surface-container-lowest": "#ffffff",
            "primary-container": "#10b981",
            "primary": "#006c49",
            "surface-container": "#e7eeff",
            "surface-container-low": "#f0f3ff",
            "surface": "#f9f9ff",
            "outline": "#6c7a71"
          },
          "fontFamily": {
            "headline-xl": ["Inter"],
            "body-md": ["Inter"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between">
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-50 w-full bg-surface-container-lowest/90 backdrop-blur-md border-b border-surface-container shadow-sm">
    <div class="h-16 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-primary-container/20 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-[22px]">savings</span>
        </div>
        <span class="text-xl font-bold text-on-surface tracking-tight">Deposit Tracker</span>
      </div>
    </div>
  </header>

  <main class="w-full flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-surface-container-lowest p-8 sm:p-10 rounded-2xl shadow-sm border border-surface-container text-center space-y-6">
      <div class="w-16 h-16 rounded-2xl bg-primary-container/20 flex items-center justify-center text-primary mx-auto">
        <span class="material-symbols-outlined text-[36px]">emoji_events</span>
      </div>

      <div class="space-y-2">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-primary-container text-on-primary uppercase tracking-wider">
          Target Achieved
        </span>
        <h1 class="text-3xl font-extrabold text-on-surface tracking-tight">Congratulations!</h1>
        <p class="text-sm text-outline">
          You've successfully reached your target savings goal! Excellent work maintaining your financial discipline.
        </p>
      </div>

      <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
        <form action="{{ url_for('home') }}" method="get" class="w-full sm:w-auto">
          <button type="submit" class="w-full sm:w-auto py-3 px-6 bg-primary-container hover:bg-primary text-on-primary font-semibold text-sm rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">home</span>
            <span>Back to Dashboard</span>
          </button>
        </form>

        <button id="startNewGoalBtn" type="button" class="w-full sm:w-auto py-3 px-6 bg-surface-container-low hover:bg-surface-container text-on-surface font-semibold text-sm rounded-xl transition-colors flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[18px]">restart_alt</span>
          <span>Start a New Goal</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="w-full bg-surface-container-lowest border-t border-surface-container py-4 text-center text-xs text-outline">
    © 2025 Deposit Tracker. Personal Liquidity Management.
  </footer>

  <script>
    document.getElementById('startNewGoalBtn').addEventListener('click', function() {
      var confirmation = confirm("Are you sure you want to start a new goal? This will reset all current deposits.");
      if (confirmation) {
        window.location.href = "{{ url_for('home', clear_deposits=True) }}";
      }
    });
  </script>
</body>
</html>
